<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Havalimanı Uçuş Bilgi Sistemi</title>
    <link rel="stylesheet" href="css/ekran.css?v=14.2">
</head>
<body>
    <header>
        <h1>Havalimanı Uçuş Bilgi Sistemi</h1>
        <time id="saat"></time>
    </header>
    <main>

        <section>
            <p id="yayin-baslik">Uçuşlar</p>
            <button id="tam-ekran" type="button">Tam ekran</button>
            <p id="ekran-mesaj" role="status" hidden></p>
            <p id="baglanti-durumu" role="status"></p>

            <table hidden>
                <thead>
                    <tr>
                        <th>Havayolu</th>
                        <th>Uçuş No</th>
                        <th>Şehir</th>
                        <th>Planlanan Saat</th>
                        <th>Tahmini Saat</th>
                        <th>Kapı</th>
                        <th>Durum</th>
                    </tr>
                </thead>

                <tbody>

                </tbody>
            </table>

            <div id="tek-ucus" hidden>
                <p id="tek-havayolu"></p>
                <h2 id="tek-ucus-no"></h2>
                <p id="tek-sehir"></p>

                <div class="tek-ucus-detaylar">
                    <p>
                        Planlanan:
                        <span id="tek-planlanan"></span>
                    </p>

                    <p>
                        Tahmini:
                        <span id="tek-tahmini"></span>
                    </p>

                    <p>
                        Kapı:
                        <span id="tek-kapi"></span>
                    </p>
                </div>

                <p id="tek-durum"></p>
            </div>

            <div id="gorsel-yayin" hidden>
                <h2 id="gorsel-baslik"></h2>
                <img id="gorsel-resim" alt="">
                <p id="gorsel-aciklama"></p>
            </div>


        </section>

        
    </main>
    <script src="api.js?v=14.2"></script>
    <script src="script.js?v=14.2"></script>
    <script src="saat.js?v=14.2"></script>
</body>
</html>
